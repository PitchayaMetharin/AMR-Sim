/amr/controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    # Use encoder-derived velocity for RPP's acceleration limiting.  The EKF
    # remains the source of the localization TF used for path tracking, but
    # its fused angular velocity lags the wheel/simulation velocity enough to
    # trap deliberate in-place turns near 0.10 rad/s.
    odom_topic: /amr/localization/wheel_odometry
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker, placement_goal_checker, retreat_goal_checker]
    controller_plugins: [FollowPath, PlacementFollowPath]
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.20
      required_movement_angle: 0.20
      movement_time_allowance: 10.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.07
      yaw_goal_tolerance: 0.15
    placement_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: false
      xy_goal_tolerance: 0.01
      yaw_goal_tolerance: 0.15
    retreat_goal_checker:
      plugin: nav2_controller::PositionGoalChecker
      stateful: false
      xy_goal_tolerance: 0.01
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.50
      lookahead_dist: 0.60
      min_lookahead_dist: 0.30
      max_lookahead_dist: 0.90
      lookahead_time: 1.50
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.30
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.60
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.90
      regulated_linear_scaling_min_speed: 0.15
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.55
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.40
      max_angular_accel: 0.40
      rotate_to_heading_min_angle: 0.785
      allow_reversing: false
      use_interpolation: true
    # Precision placement uses the same collision and regulation limits as
    # normal navigation, but can back away from a tight endpoint instead of
    # rotating the full rectangular footprint into the station pedestal.
    PlacementFollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.10
      lookahead_dist: 0.60
      min_lookahead_dist: 0.30
      max_lookahead_dist: 0.90
      lookahead_time: 1.50
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.30
      min_approach_linear_velocity: 0.01
      approach_velocity_scaling_dist: 0.60
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.90
      regulated_linear_scaling_min_speed: 0.15
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.55
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      use_rotate_to_heading: false
      rotate_to_heading_angular_vel: 0.40
      max_angular_accel: 0.40
      rotate_to_heading_min_angle: 0.785
      allow_reversing: true
      use_interpolation: true

/amr/local_costmap/local_costmap:
  ros__parameters:
    use_sim_time: true
    update_frequency: 5.0
    publish_frequency: 2.0
    global_frame: odom
    robot_base_frame: base_footprint
    rolling_window: true
    width: 5
    height: 5
    resolution: 0.05
    footprint: "[[0.6, 0.4], [0.6, -0.4], [-0.6, -0.4], [-0.6, 0.4]]"
    plugins: [obstacle_layer, inflation_layer]
    obstacle_layer:
      plugin: nav2_costmap_2d::ObstacleLayer
      enabled: true
      observation_sources: front_points rear_points
      front_points:
        topic: /amr/perception/front_lidar/points
        data_type: PointCloud2
        marking: true
        clearing: true
        min_obstacle_height: 0.0
        max_obstacle_height: 2.0
        obstacle_max_range: 10.0
        raytrace_max_range: 12.0
      rear_points:
        topic: /amr/perception/rear_lidar/points
        data_type: PointCloud2
        marking: true
        clearing: true
        min_obstacle_height: 0.0
        max_obstacle_height: 2.0
        obstacle_max_range: 10.0
        raytrace_max_range: 12.0
    inflation_layer:
      plugin: nav2_costmap_2d::InflationLayer
      inflation_radius: 0.55
      cost_scaling_factor: 3.0
    always_send_full_costmap: true

/amr/lifecycle_manager_controller:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names: [controller_server]
