/amr/product_tag_detector:
  ros__parameters:
    use_sim_time: true
    image_transport: raw
    family: 36h11
    size: 0.10
    max_hamming: 0
    qos_profile: sensor_data
    detector:
      threads: 2
      decimate: 1.0
      blur: 0.0
      refine: true
      sharpening: 0.25
      debug: false
    pose_estimation_method: pnp
    tag:
      ids: [10, 11, 12, 20, 101, 102, 103]
      frames:
        [pickup_a_tag, pickup_b_tag, pickup_c_tag, dispatch_tag,
         product_a_tag, product_b_tag, product_c_tag]
      sizes: [0.10, 0.10, 0.10, 0.10, 0.06, 0.06, 0.06]
