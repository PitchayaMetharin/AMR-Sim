/amr/amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.0
    alpha2: 0.0
    alpha3: 0.0
    alpha4: 0.0
    alpha5: 0.0
    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: /amr/sensors/front_lidar/scan
    min_particles: 500
    max_particles: 2000
    max_beams: 60
    laser_min_range: 0.1
    laser_max_range: 20.0
    update_min_d: 0.05
    update_min_a: 0.05
    transform_tolerance: 0.2
    set_initial_pose: true
    initial_pose:
      x: -4.5
      y: 0.0
      z: 0.0
      yaw: 0.0

/amr/map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

/amr/lifecycle_manager_factory_localization:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names: [map_server, amcl]
