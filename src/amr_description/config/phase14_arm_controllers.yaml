controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_controller:
  ros__parameters:
    joints:
      - arm_joint_1
      - arm_joint_2
      - arm_joint_3
      - arm_joint_4
      - arm_joint_5
      - arm_joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: false
    constraints:
      goal_time: 1.0
      stopped_velocity_tolerance: 0.02
      arm_joint_1: {trajectory: 0.2, goal: 0.02}
      arm_joint_2: {trajectory: 0.2, goal: 0.02}
      arm_joint_3: {trajectory: 0.2, goal: 0.02}
      arm_joint_4: {trajectory: 0.2, goal: 0.02}
      arm_joint_5: {trajectory: 0.2, goal: 0.02}
      arm_joint_6: {trajectory: 0.2, goal: 0.02}

