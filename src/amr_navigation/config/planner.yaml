/amr/planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      # Keep planner endpoints within the normal 70 mm controller goal
      # tolerance.  The previous 250 mm allowance let short placement
      # segments terminate well before their requested pose.
      tolerance: 0.05
      use_astar: true
      allow_unknown: true

/amr/global_costmap/global_costmap:
  ros__parameters:
    use_sim_time: true
    update_frequency: 2.0
    publish_frequency: 1.0
    global_frame: map
    robot_base_frame: base_footprint
    resolution: 0.05
    track_unknown_space: true
    footprint: "[[0.6, 0.4], [0.6, -0.4], [-0.6, -0.4], [-0.6, 0.4]]"
    plugins: [static_layer, obstacle_layer, inflation_layer]
    static_layer:
      plugin: nav2_costmap_2d::StaticLayer
      map_topic: /map
      map_subscribe_transient_local: true
    obstacle_layer:
      plugin: nav2_costmap_2d::ObstacleLayer
      enabled: true
      observation_sources: front_points rear_points
      front_points:
        topic: /amr/perception/front_lidar/points
        data_type: PointCloud2
        marking: true
        clearing: true
        min_obstacle_height: 0.0
        max_obstacle_height: 2.0
        obstacle_max_range: 10.0
        raytrace_max_range: 12.0
      rear_points:
        topic: /amr/perception/rear_lidar/points
        data_type: PointCloud2
        marking: true
        clearing: true
        min_obstacle_height: 0.0
        max_obstacle_height: 2.0
        obstacle_max_range: 10.0
        raytrace_max_range: 12.0
    inflation_layer:
      plugin: nav2_costmap_2d::InflationLayer
      inflation_radius: 0.55
      cost_scaling_factor: 3.0
    always_send_full_costmap: true

/amr/lifecycle_manager_planning:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names: [planner_server, smoother_server]

/amr/smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      w_data: 0.2
      w_smooth: 0.3
      do_refinement: true
    costmap_topic: global_costmap/costmap_raw
    footprint_topic: global_costmap/published_footprint
